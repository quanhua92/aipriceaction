[project]
name = "aipriceaction-api"
version = "0.1.0"
description = "FastAPI market data API with SQLite and S3 Parquet history"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx[socks]>=0.28,<1",
  "duckdb>=1.4,<2",
  "boto3>=1.35,<2",
  "python-dotenv>=1,<2",
]

[project.scripts]
aipa-api = "aipriceaction_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipriceaction_api"]

[tool.hatch.build.targets.wheel.force-include]
"watchlist.json" = "aipriceaction_api/data/watchlist.json"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
