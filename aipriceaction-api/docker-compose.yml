name: aipriceaction-api

x-api-environment: &api-environment
  AIPA_API_HOME: /app
  SQLITE_PATH: /data/aipriceaction.sqlite3
  ARCHIVE_CACHE_PATH: /data/archive-cache
  ARCHIVE_OBJECT_PATH: /data/objects
  UPLOADS_PATH: /data/uploads
  UPLOADS_MAX_BYTES: ${UPLOADS_MAX_BYTES:-536870912}
  UPLOADS_MAX_SESSIONS: ${UPLOADS_MAX_SESSIONS:-10000}
  ARCHIVE_BACKEND: ${ARCHIVE_BACKEND:-s3}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
  S3_BUCKET: ${S3_BUCKET:-aipriceaction-api-local}
  S3_PREFIX: ${S3_PREFIX:-parquet}
  PUBLIC_EXPORT_ENABLED: ${PUBLIC_EXPORT_ENABLED:-true}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-aipa-local}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-aipa-local-development-only}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  API_MAX_LIMIT: ${API_MAX_LIMIT:-40}
  RUST_TICKER_IDENTITY_ORDER_PATH: ${RUST_TICKER_IDENTITY_ORDER_PATH:-}
  INGEST_UNIVERSE: ${INGEST_UNIVERSE:-catalog}
  WATCHLIST_PATH: /app/watchlist.json
  ALLOW_DIRECT: ${ALLOW_DIRECT:-true}
  HTTP_PROXIES: ${HTTP_PROXIES:-}
  VN_PROVIDERS: ${VN_PROVIDERS:-vps,vndirect,dnse}
  VN_PROVIDER_MIGRATION_CONCURRENCY: ${VN_PROVIDER_MIGRATION_CONCURRENCY:-2}
  VCI_HISTORY_FALLBACK: ${VCI_HISTORY_FALLBACK:-false}
  PROVIDER_RPM: ${PROVIDER_RPM:-30}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-6}
  DAILY_RETENTION_YEARS: ${DAILY_RETENTION_YEARS:-3}
  HOURLY_RETENTION_YEARS: ${HOURLY_RETENTION_YEARS:-3}
  MINUTE_RETENTION_YEARS: ${MINUTE_RETENTION_YEARS:-1}
  HISTORY_YEARS: ${HISTORY_YEARS:-10}
  HISTORY_PAGE_SIZE: ${HISTORY_PAGE_SIZE:-500}
  HISTORY_BATCH_ROWS: ${HISTORY_BATCH_ROWS:-1000}
  HISTORY_PROVIDER_RPM: ${HISTORY_PROVIDER_RPM:-5}
  HISTORY_PAUSE_SECONDS: ${HISTORY_PAUSE_SECONDS:-1}
  SYNC_TOKEN: ${SYNC_TOKEN:-}
  REFRESH_SECRET: ${REFRESH_SECRET:?Set a non-empty REFRESH_SECRET before starting the API}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://aipriceaction.com,https://api.aipriceaction.com}
  AIPA_LOG_LEVEL: ${AIPA_LOG_LEVEL:-INFO}
  API_READ_CONCURRENCY: ${API_READ_CONCURRENCY:-4}
  API_MARKET_READ_CONCURRENCY: ${API_MARKET_READ_CONCURRENCY:-4}
  API_REQUEST_CONCURRENCY: ${API_REQUEST_CONCURRENCY:-64}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://100.116.162.91:5080}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-aipriceaction}
  OTEL_AUTH_HEADER: ${OTEL_AUTH_HEADER:-}
  REDIS_DAILY_MAX_SIZE: ${REDIS_DAILY_MAX_SIZE:-5000}
  REDIS_HOURLY_MAX_SIZE: ${REDIS_HOURLY_MAX_SIZE:-30000}
  REDIS_MINUTE_MAX_SIZE: ${REDIS_MINUTE_MAX_SIZE:-20000}
  REDIS_URL: ${REDIS_URL:-}

x-api-service: &api-service
  build:
    context: .
  image: aipriceaction-api:local
  env_file:
    - .env
  environment: *api-environment
  volumes:
    - ${AIPA_DATA_DIR:-./data}:/data
  depends_on:
    initialize:
      condition: service_completed_successfully
  security_opt:
    - no-new-privileges:true
  init: true

services:
  rustfs:
    container_name: aipriceaction-rustfs
    image: ${RUSTFS_IMAGE:-rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff}
    ports:
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_API_PORT:-9100}:9000"
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9101}:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-aipa-local}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-aipa-local-development-only}
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  initialize:
    container_name: aipriceaction-init
    build:
      context: .
    image: aipriceaction-api:local
    command: ["aipa-api", "init", "--s3"]
    env_file:
      - .env
    environment: *api-environment
    volumes:
      - ${AIPA_DATA_DIR:-./data}:/data
    depends_on:
      rustfs:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"

  api:
    container_name: aipriceaction-api
    <<: *api-service
    command: ["aipa-api", "serve", "--host", "0.0.0.0", "--port", "8899"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  api2:
    container_name: aipriceaction-api-2
    <<: *api-service
    command: ["aipa-api", "serve", "--host", "0.0.0.0", "--port", "8899"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  nginx:
    container_name: aipriceaction-nginx
    image: nginx:1.28-alpine
    ports:
      - "0.0.0.0:${AIPA_API_PORT:-8899}:8899"
      - "127.0.0.1:${AIPA_API_SSR_PORT:-3003}:8899"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      api2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8899/health"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 5s

  worker:
    container_name: aipriceaction-worker-daily
    <<: *api-service
    # Keep the previous aggregate provider budget: 2 concurrent requests and
    # 10 requests/minute per route in each of the three interval workers.
    environment:
      <<: *api-environment
      WORKER_CONCURRENCY: ${DAILY_WORKER_CONCURRENCY:-2}
      PROVIDER_RPM: ${DAILY_PROVIDER_RPM:-10}
    command: ["aipa-api", "worker", "--interval", "1D"]
    restart: unless-stopped

  worker-hourly:
    container_name: aipriceaction-worker-hourly
    <<: *api-service
    environment:
      <<: *api-environment
      WORKER_CONCURRENCY: ${HOURLY_WORKER_CONCURRENCY:-2}
      PROVIDER_RPM: ${HOURLY_PROVIDER_RPM:-10}
    command: ["aipa-api", "worker", "--interval", "1h", "--skip-catalog-publish"]
    restart: unless-stopped

  worker-minute:
    container_name: aipriceaction-worker-minute
    <<: *api-service
    environment:
      <<: *api-environment
      WORKER_CONCURRENCY: ${MINUTE_WORKER_CONCURRENCY:-2}
      PROVIDER_RPM: ${MINUTE_PROVIDER_RPM:-10}
    command: ["aipa-api", "worker", "--interval", "1m", "--skip-catalog-publish"]
    restart: unless-stopped

  worker-history:
    container_name: aipriceaction-worker-history
    <<: *api-service
    environment:
      <<: *api-environment
      HISTORY_WORKER_CONCURRENCY: ${HISTORY_WORKER_CONCURRENCY:-2}
      PROVIDER_RPM: ${HISTORY_PROVIDER_RPM:-5}
    command: ["aipa-api", "history-worker"]
    restart: unless-stopped

  # Invoked by the host's user crontab, never started by `compose up`.
  # Production SQLite and WAL files are root-owned. This one-shot helper uses
  # the same container owner to acquire WAL locks; it writes only the snapshot.
  sqlite-backup:
    profiles: [backup]
    build:
      context: .
    image: aipriceaction-api:backup-local
    environment:
      AIPA_API_HOME: /app
      SQLITE_PATH: /data/aipriceaction.sqlite3
    volumes:
      - ${AIPA_DATA_DIR:-./data}:/data
    command: ["aipa-api", "backup", "/backup/aipriceaction.sqlite3"]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    cpu_shares: 256

  # Restic runs as a one-shot job. It receives only the S3 credentials and
  # repository settings needed for encrypted backups, not provider/API secrets.
  backup-restic:
    profiles: [backup]
    image: restic/restic:0.19.1
    user: "${AIPA_BACKUP_UID:-1000}:${AIPA_BACKUP_GID:-1000}"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      RESTIC_CACHE_DIR: /tmp/restic-cache
    security_opt:
      - no-new-privileges:true
    restart: "no"
    cpu_shares: 256

volumes:
  rustfs_data:
  rustfs_logs:
