name: aipriceaction-api

# Local object storage only. FastAPI and workers run on the host;
# SQLite is a local file and DuckDB is an embedded Python library.
services:
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff}
    ports:
      # Separate from the legacy stack's 9000/9001; local access only.
      - "127.0.0.1:${RUSTFS_API_PORT:-9100}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9101}:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-aipa-local}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-aipa-local-development-only}
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  rustfs_data:
  rustfs_logs:
