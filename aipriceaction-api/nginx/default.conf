map $http_x_forwarded_proto $aipa_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream aipriceaction_api {
    least_conn;
    server api:8899 max_fails=1 fail_timeout=5s;
    server api2:8899 max_fails=1 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 8899;
    server_name _;

    client_max_body_size 512m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://aipriceaction_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $aipa_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
